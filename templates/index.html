<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hybrid RAG Chatbot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fa-solid fa-staff-snake"></i>JeevaVeda</h1>
            <p class="subtitle">Hybrid RAG-powered Chatbot for Indian Medicinal Plants</p>
        </header>

        <div class="chat-container">
            <div class="chat-messages" id="chatMessages">
                <div class="message bot-message">
                    <div class="message-content">
                        <p>Hello! I'm your hybrid RAG chatbot. I can answer questions about medicinal plants, illnesses, symptoms, and treatments using both structured knowledge graphs and PDF documents.</p>
                        <p>Ask me anything about plants, treatments, or health!</p>
                    </div>
                </div>
            </div>

            <div class="chat-input-container">
                <input 
                    type="text" 
                    id="messageInput" 
                    placeholder="Type your message here..." 
                    autocomplete="off"
                >
                <button id="sendButton"><i class="fas fa-paper-plane"></i> Send</button>
                <button id="clearButton"><i class="fas fa-trash"></i> Clear</button>
            </div>

            <div class="actions">
                <button id="ingestButton"><i class="fas fa-file-upload"></i> Ingest PDFs</button>
                <span id="status"></span>
            </div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
