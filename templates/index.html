<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hybrid RAG Chatbot</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🌿 Hybrid RAG Chatbot</h1>
            <p class="subtitle">Neo4j Graph + Weaviate Vector Search</p>
        </header>

        <div class="chat-container">
            <div class="chat-messages" id="chatMessages">
                <div class="message bot-message">
                    <div class="message-content">
                        <p>Hello! I'm your hybrid RAG chatbot. I can answer questions about medicinal plants, illnesses, symptoms, and treatments using both structured knowledge graphs and PDF documents.</p>
                        <p>Ask me anything about plants, treatments, or health!</p>
                    </div>
                </div>
            </div>

            <div class="chat-input-container">
                <input 
                    type="text" 
                    id="messageInput" 
                    placeholder="Type your message here..." 
                    autocomplete="off"
                >
                <button id="sendButton">Send</button>
                <button id="clearButton">Clear</button>
            </div>

            <div class="actions">
                <button id="ingestButton">Ingest PDFs</button>
                <span id="status"></span>
            </div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
